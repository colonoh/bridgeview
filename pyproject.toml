[project]
name = "bridgeview"
version = "0.1.0"
description = "Which San Francisco buildings can see the Golden Gate Bridge, Alcatraz and the Bay Bridge"
readme = "README.md"
authors = [
    { name = "colonoh-bot", email = "colonoh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.5",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.coverage.report]
fail_under = 90

[tool.pytest.ini_options]
addopts = "--cov=bridgeview --cov-report=term-missing"

[project.scripts]
bridgeview = "bridgeview.cli:main"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# These packages ship no type information (no py.typed).
module = ["shapely.*", "rasterio.*", "geopandas.*", "pandas.*"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/bridgeview/visibility.py"]
also_copy = ["tests", "datasets.toml"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
