# Landmark reference points (spec FR-002, FR-008; research R5; data-model.md: Landmark).
#
# Positions: WGS84 lat/lon. Bridge towers and the lighthouse are OpenStreetMap
# centroids, (c) OpenStreetMap contributors, ODbL 1.0, retrieved 2026-11-21.
# Heights: NAVD88 metres. "Above water" figures were converted with NOAA station
# 9414290 datums (MLLW +0.02 m, MHW +1.61 m, MHHW +1.80 m relative to NAVD88).
# A landmark counts as visible when any one of its points is visible.

landmarks_version = "1"

